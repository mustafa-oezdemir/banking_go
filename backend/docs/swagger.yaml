basePath: /
definitions:
  api.AccountResponse:
    properties:
      account_type:
        type: string
      available_balance:
        type: string
      balance:
        type: string
      created_at:
        type: string
      currency:
        type: string
      iban:
        type: string
      id:
        type: string
      is_system:
        type: boolean
      masked_iban:
        type: string
      name:
        type: string
      owner_id:
        type: string
      status:
        type: string
      updated_at:
        type: string
    type: object
  api.EntryResponse:
    properties:
      account_id:
        type: string
      booking_date:
        type: string
      category:
        type: string
      counterparty_iban:
        type: string
      counterparty_name:
        type: string
      created_at:
        type: string
      credit:
        type: string
      debit:
        type: string
      description:
        type: string
      execution_date:
        type: string
      id:
        type: string
      operation_type:
        type: string
      payment_order_id:
        type: string
      purpose:
        type: string
      transaction_id:
        type: string
    type: object
  api.ErrorResponse:
    properties:
      error:
        type: string
    type: object
  api.MessageResponse:
    properties:
      message:
        type: string
    type: object
  api.PaymentResponse:
    properties:
      amount:
        type: string
      beneficiary_bic:
        type: string
      beneficiary_iban:
        type: string
      beneficiary_name:
        type: string
      created_at:
        type: string
      creditor_reference:
        type: string
      currency:
        type: string
      demo:
        type: boolean
      end_to_end_id:
        type: string
      failure_reason:
        type: string
      id:
        type: string
      ledger_transaction_id:
        type: string
      masked_beneficiary_iban:
        type: string
      payment_kind:
        type: string
      processed_at:
        type: string
      purpose:
        type: string
      reject_code:
        type: string
      requested_execution_at:
        type: string
      schedule_type:
        type: string
      source_account_id:
        type: string
      status:
        type: string
      updated_at:
        type: string
      vop_overridden:
        type: boolean
      vop_result:
        type: string
      vop_suggested_name:
        type: string
    type: object
  api.ReconcileResponse:
    properties:
      matched:
        type: boolean
      message:
        type: string
    type: object
  api.RegisterResponse:
    properties:
      email:
        type: string
      user_id:
        type: string
    type: object
  api.StandingOrderRequest:
    properties:
      amount:
        type: string
      beneficiary_bic:
        type: string
      beneficiary_iban:
        type: string
      beneficiary_name:
        type: string
      creditor_reference:
        type: string
      end_date:
        type: string
      frequency:
        type: string
      max_occurrences:
        type: integer
      purpose:
        type: string
      source_account_id:
        type: string
      start_date:
        type: string
      transfer_type:
        type: string
    type: object
  api.StandingOrderResponse:
    properties:
      amount:
        type: string
      beneficiary_name:
        type: string
      currency:
        type: string
      end_date:
        type: string
      frequency:
        type: string
      id:
        type: string
      masked_beneficiary_iban:
        type: string
      max_occurrences:
        type: integer
      next_execution_at:
        type: string
      occurrences_created:
        type: integer
      purpose:
        type: string
      source_account_id:
        type: string
      start_date:
        type: string
      status:
        type: string
      transfer_type:
        type: string
    type: object
  service.VoPResult:
    properties:
      demo_notice:
        type: string
      result:
        type: string
      suggested_name:
        type: string
    type: object
host: localhost:8080
info:
  contact: {}
  description: Production-grade double-entry accounting ledger
  title: Double-Entry Bank Ledger API
  version: "1.0"
paths:
  /accounts:
    get:
      description: Returns list of accounts owned by authenticated user
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/api.AccountResponse'
            type: array
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.ErrorResponse'
      security:
      - Bearer: []
      summary: List user accounts
      tags:
      - accounts
    post:
      consumes:
      - application/json
      description: Creates a new user-owned account with name and currency
      parameters:
      - description: Account details
        in: body
        name: body
        required: true
        schema:
          properties:
            name:
              type: string
          type: object
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/api.AccountResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.ErrorResponse'
      security:
      - Bearer: []
      summary: Create a new account
      tags:
      - accounts
  /accounts/{id}:
    delete:
      description: Deletes a user-owned account only when its balance is zero and
        it has no ledger entries
      parameters:
      - description: Account ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.MessageResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.ErrorResponse'
      security:
      - Bearer: []
      summary: Delete an unused account
      tags:
      - accounts
    get:
      description: Returns details of a specific account
      parameters:
      - description: Account ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.AccountResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/api.ErrorResponse'
      security:
      - Bearer: []
      summary: Get account details
      tags:
      - accounts
    put:
      consumes:
      - application/json
      description: Renames an account owned by the authenticated user
      parameters:
      - description: Account ID
        in: path
        name: id
        required: true
        type: string
      - description: Updated account details
        in: body
        name: body
        required: true
        schema:
          properties:
            name:
              type: string
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.AccountResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.ErrorResponse'
      security:
      - Bearer: []
      summary: Update an account
      tags:
      - accounts
  /accounts/{id}/deposit:
    post:
      consumes:
      - application/json
      description: Deposits fiat amount (mock) with double-entry ledger update
      parameters:
      - description: Account ID
        in: path
        name: id
        required: true
        type: string
      - description: Deposit amount (e.g., 1000.0000)
        in: body
        name: body
        required: true
        schema:
          properties:
            amount:
              type: string
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.MessageResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.ErrorResponse'
      security:
      - Bearer: []
      summary: Deposit money into account
      tags:
      - accounts
  /accounts/{id}/entries:
    get:
      description: Returns list of ledger entries for an account (immutable history)
      parameters:
      - description: Account ID
        in: path
        name: id
        required: true
        type: string
      - description: Limit (default 20)
        in: query
        name: limit
        type: integer
      - description: Offset (default 0)
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/api.EntryResponse'
            type: array
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.ErrorResponse'
      security:
      - Bearer: []
      summary: Get account entries
      tags:
      - accounts
  /accounts/{id}/reconcile:
    get:
      description: Verifies stored balance matches sum of all ledger entries (credits
        - debits)
      parameters:
      - description: Account ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.ReconcileResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.ErrorResponse'
      security:
      - Bearer: []
      summary: Reconcile account balance
      tags:
      - accounts
  /accounts/{id}/transactions:
    get:
      parameters:
      - description: Account ID
        in: path
        name: id
        required: true
        type: string
      - description: CREDIT or DEBIT
        in: query
        name: direction
        type: string
      - description: Category
        in: query
        name: category
        type: string
      - description: Payment status
        in: query
        name: status
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/api.EntryResponse'
            type: array
      security:
      - BearerAuth: []
      summary: List and filter account transactions
      tags:
      - transactions
  /accounts/{id}/withdraw:
    post:
      consumes:
      - application/json
      description: Withdraws fiat amount (mock) with double-entry ledger update
      parameters:
      - description: Account ID
        in: path
        name: id
        required: true
        type: string
      - description: Withdraw amount (e.g., 500.0000)
        in: body
        name: body
        required: true
        schema:
          properties:
            amount:
              type: string
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.MessageResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.ErrorResponse'
      security:
      - Bearer: []
      summary: Withdraw money from account
      tags:
      - accounts
  /events:
    get:
      produces:
      - text/event-stream
      responses:
        "200":
          description: SSE stream
          schema:
            type: string
      security:
      - BearerAuth: []
      summary: Stream payment events over SSE
      tags:
      - events
  /login:
    post:
      consumes:
      - application/json
      description: Authenticates user with email/password and returns JWT token
      parameters:
      - description: User login details
        in: body
        name: body
        required: true
        schema:
          properties:
            email:
              type: string
            password:
              type: string
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.MessageResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.ErrorResponse'
      summary: Login user
      tags:
      - auth
  /payees/verify:
    post:
      consumes:
      - application/json
      description: Compares a payee name and IBAN and returns MATCH, CLOSE_MATCH,
        NO_MATCH, or OTHER.
      parameters:
      - description: Payee name and IBAN
        in: body
        name: request
        required: true
        schema:
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/service.VoPResult'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Verify a demo payee
      tags:
      - payments
  /payments:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/api.PaymentResponse'
            type: array
      security:
      - BearerAuth: []
      summary: List payment orders
      tags:
      - payments
    post:
      consumes:
      - application/json
      parameters:
      - description: Unique payment intent key
        in: header
        name: Idempotency-Key
        required: true
        type: string
      - description: Payment details; monetary values are strings
        in: body
        name: request
        required: true
        schema:
          type: object
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/api.PaymentResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/api.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Create an idempotent payment order
      tags:
      - payments
  /payments/{id}:
    get:
      parameters:
      - description: Payment ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.PaymentResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/api.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get a payment order
      tags:
      - payments
  /payments/{id}/cancel:
    post:
      parameters:
      - description: Payment ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.PaymentResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/api.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Cancel a draft or scheduled payment
      tags:
      - payments
  /payments/{id}/confirm:
    post:
      consumes:
      - application/json
      parameters:
      - description: Payment ID
        in: path
        name: id
        required: true
        type: string
      - description: Demo consent and optional VoP override
        in: body
        name: request
        required: true
        schema:
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.PaymentResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/api.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Confirm and book or schedule a demo payment
      tags:
      - payments
  /register:
    post:
      consumes:
      - application/json
      description: Creates a new user with email and hashed password, returns user
        details and JWT token
      parameters:
      - description: User registration details
        in: body
        name: body
        required: true
        schema:
          properties:
            email:
              type: string
            password:
              type: string
          type: object
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/api.RegisterResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.ErrorResponse'
      summary: Register a new user
      tags:
      - auth
  /standing-orders:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/api.StandingOrderResponse'
            type: array
      security:
      - BearerAuth: []
      summary: List recurring demo payments
      tags:
      - standing-orders
    post:
      consumes:
      - application/json
      parameters:
      - description: Standing order details
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/api.StandingOrderRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/api.StandingOrderResponse'
      security:
      - BearerAuth: []
      summary: Create a recurring demo payment
      tags:
      - standing-orders
  /standing-orders/{id}:
    delete:
      parameters:
      - description: Standing order ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.StandingOrderResponse'
      security:
      - BearerAuth: []
      summary: Cancel a recurring demo payment
      tags:
      - standing-orders
    patch:
      consumes:
      - application/json
      parameters:
      - description: Standing order ID
        in: path
        name: id
        required: true
        type: string
      - description: Mutable standing order fields
        in: body
        name: request
        required: true
        schema:
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.StandingOrderResponse'
      security:
      - BearerAuth: []
      summary: Update a recurring demo payment
      tags:
      - standing-orders
  /transactions/{id}:
    get:
      description: Returns both entries (debit and credit) for a complete transaction
        view
      parameters:
      - description: Transaction ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/api.EntryResponse'
            type: array
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.ErrorResponse'
      security:
      - Bearer: []
      summary: Get transaction details
      tags:
      - accounts
  /transfers:
    post:
      consumes:
      - application/json
      description: Transfers funds between accounts with atomic double-entry updates.
        The amount field accepts JSON number or string. from_id/to_id are preferred;
        from_account_id/to_account_id are supported as legacy aliases.
      parameters:
      - description: Transfer details
        in: body
        name: body
        required: true
        schema:
          properties:
            amount:
              type: string
            from_id:
              type: string
            to_id:
              type: string
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.MessageResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/api.ErrorResponse'
      security:
      - Bearer: []
      summary: Transfer money between accounts
      tags:
      - accounts
securityDefinitions:
  Bearer:
    description: Type "Bearer" followed by a space and JWT token
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
