services:
  # Backend API
  - type: web
    name: pehlione-banking
    runtime: docker
    plan: free
    region: frankfurt
    branch: main
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    envVars:
      - key: PORT
        value: 8080
      - key: JWT_SECRET
        generateValue: true
      - key: DB_URL
        fromDatabase:
          name: ledger-db
          property: connectionString
      - key: CORS_ALLOWED_ORIGINS
        value: https://pehlione-banking.com,https://www.pehlione-banking.com,https://pehlione-banking-frontend.onrender.com,https://banking-go.onrender.com
      - key: DEMO_SEED
        value: false
      - key: DEMO_SEED_PASSWORD
        sync: false
      - key: ADMIN_SEED_EMAIL
        value: admin.banking@pehlione.com
      - key: ADMIN_SEED_PASSWORD
        sync: false
      - key: ENABLE_IN_PROCESS_SCHEDULER
        value: true
      - key: RUN_DB_MIGRATIONS_ON_START
        value: true
      - key: RESEND_API_KEY
        sync: false
      - key: MAIL_FROM
        value: Pehlione DemoBank <banking@pehlione.com>
      - key: FRONTEND_URL
        value: https://pehlione-banking-frontend.onrender.com
    healthCheckPath: /health

  # Next.js frontend
  - type: web
    name: pehlione-banking-frontend
    runtime: docker
    plan: free
    region: frankfurt
    branch: main
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: ./frontend
    envVars:
      - key: PORT
        value: 3000
      - key: BACKEND_API_URL
        value: https://banking-go.onrender.com
    healthCheckPath: /

# PostgreSQL Database
databases:
  - name: ledger-db
    plan: free
    databaseName: simple_ledger
    user: ledger_user
    region: frankfurt
