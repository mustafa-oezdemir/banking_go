services:
  # Backend API
  - type: web
    name: pehlione-banking
    runtime: docker
    plan: free
    region: frankfurt
    branch: main
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    envVars:
      - key: PORT
        value: 8080
      - key: JWT_SECRET
        generateValue: true
      - key: DB_URL
        fromDatabase:
          name: ledger-db
          property: connectionString
    healthCheckPath: /health

# PostgreSQL Database
databases:
  - name: ledger-db
    plan: free
    databaseName: simple_ledger
    user: ledger_user
    region: frankfurt
