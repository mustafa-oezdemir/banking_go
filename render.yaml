services:
  # Backend API
  - type: web
    name: pehlione-banking
    runtime: docker
    plan: free
    region: frankfurt
    branch: main
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    envVars:
      - key: PORT
        value: 8080
      - key: JWT_SECRET
        generateValue: true
      - key: DB_URL
        fromDatabase:
          name: ledger-db
          property: connectionString
    healthCheckPath: /health

  # Next.js frontend
  - type: web
    name: pehlione-banking-frontend
    runtime: docker
    plan: free
    region: frankfurt
    branch: main
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: ./frontend
    envVars:
      - key: PORT
        value: 3000
      - key: BACKEND_API_URL
        value: https://banking-go.onrender.com
    healthCheckPath: /

# PostgreSQL Database
databases:
  - name: ledger-db
    plan: free
    databaseName: simple_ledger
    user: ledger_user
    region: frankfurt
