services:
  postgres:
    image: postgres:16
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-root}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
      POSTGRES_DB: ${DB_NAME:-simple_ledger}
    ports:
      # DB_PORT is the host port; PostgreSQL stays on 5432 in the Compose network.
      - "${DB_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-root} -d ${DB_NAME:-simple_ledger}"]
      interval: 5s
      timeout: 5s
      retries: 5

  db-role-provisioner:
    image: postgres:16
    restart: "no"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-simple_ledger}
      DB_USER: ${DB_USER:-root}
      DB_PASSWORD: ${DB_PASSWORD:-secret}
      BANKING_DB_PASSWORD: ${BANKING_DB_PASSWORD:?BANKING_DB_PASSWORD must be set in .env}
      IDENTITY_DB_PASSWORD: ${IDENTITY_DB_PASSWORD:?IDENTITY_DB_PASSWORD must be set in .env}
      NOTIFICATION_DB_PASSWORD: ${NOTIFICATION_DB_PASSWORD:?NOTIFICATION_DB_PASSWORD must be set in .env}
    volumes:
      - ./docker/postgres/provision-service-roles.sh:/usr/local/bin/provision-service-roles:ro
    command: ["/bin/sh", "/usr/local/bin/provision-service-roles"]
    depends_on:
      postgres:
        condition: service_healthy

  migrations:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: "no"
    command: ["/bin/true"]
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-simple_ledger}
      DB_USER: ${DB_USER:-root}
      DB_PASSWORD: ${DB_PASSWORD:-secret}
      DB_SSLMODE: ${DB_SSLMODE:-disable}
      RUN_DB_MIGRATIONS_ON_START: "true"
    depends_on:
      db-role-provisioner:
        condition: service_completed_successfully

  mailhog:
    image: mailhog/mailhog:v1.0.1
    restart: unless-stopped
    ports:
      - "${MAILHOG_HTTP_PORT:-8425}:8025"

  rabbitmq:
    image: rabbitmq:4-management-alpine
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-banking}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD must be set in .env}
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    volumes:
      - ./observability/rabbitmq/enabled_plugins:/etc/rabbitmq/enabled_plugins:ro
      - ./observability/rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "rabbitmq-diagnostics -q ping"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  jaeger:
    image: jaegertracing/all-in-one:1.76.0
    restart: unless-stopped
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "${JAEGER_UI_PORT:-16686}:16686"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:16686/ || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 12

  prometheus:
    image: prom/prometheus:v3.7.3
    restart: unless-stopped
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/prometheus/rules:/etc/prometheus/rules:ro
      - prometheus_data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle
    depends_on:
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:9090/-/healthy || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s

  grafana:
    image: grafana/grafana:11.6.0
    restart: unless-stopped
    ports:
      - "${GRAFANA_PORT:-3001}:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD must be set in .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/api/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  notification-service:
    build:
      context: .
      dockerfile: backend/Dockerfile.notification
    restart: unless-stopped
    ports:
      - "${NOTIFICATION_HTTP_PORT:-8490}:8090"
    environment:
      NOTIFICATION_PORT: 8090
      NOTIFICATION_SERVICE_TOKEN: ${NOTIFICATION_SERVICE_TOKEN:?NOTIFICATION_SERVICE_TOKEN must be set in .env}
      NOTIFICATION_DELIVERY_TIMEOUT: ${NOTIFICATION_DELIVERY_TIMEOUT:-12s}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      MAIL_FROM: ${MAIL_FROM:-Pehlione DemoBank <banking@pehlione.com>}
      SMTP_HOST: ${SMTP_HOST:-mailhog}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      OTEL_EXPORTER_OTLP_ENDPOINT: jaeger:4318
      OTEL_EXPORTER_OTLP_INSECURE: "true"
      NOTIFICATION_DB_HOST: postgres
      NOTIFICATION_DB_PORT: 5432
      NOTIFICATION_DB_NAME: ${DB_NAME:-simple_ledger}
      NOTIFICATION_DB_USER: notification_app
      NOTIFICATION_DB_PASSWORD: ${NOTIFICATION_DB_PASSWORD:?NOTIFICATION_DB_PASSWORD must be set in .env}
      NOTIFICATION_DB_SSLMODE: ${DB_SSLMODE:-disable}
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-banking}:${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD must be set in .env}@rabbitmq:5672/
      RABBITMQ_RETRY_DELAY: ${RABBITMQ_RETRY_DELAY:-5s}
      RABBITMQ_MAX_RETRIES: ${RABBITMQ_MAX_RETRIES:-3}
    depends_on:
      mailhog:
        condition: service_started
      postgres:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8090/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s

  identity-service:
    build:
      context: .
      dockerfile: backend/Dockerfile.identity
    restart: unless-stopped
    environment:
      IDENTITY_PORT: 8081
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-simple_ledger}
      DB_USER: identity_app
      DB_PASSWORD: ${IDENTITY_DB_PASSWORD:?IDENTITY_DB_PASSWORD must be set in .env}
      DB_SSLMODE: ${DB_SSLMODE:-disable}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set in .env}
      BANKING_INTERNAL_URL: http://banking-api:${PORT:-8080}
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:?INTERNAL_SERVICE_TOKEN must be set in .env}
      NOTIFICATION_SERVICE_URL: http://notification-service:8090
      NOTIFICATION_SERVICE_TOKEN: ${NOTIFICATION_SERVICE_TOKEN:?NOTIFICATION_SERVICE_TOKEN must be set in .env}
      OTEL_EXPORTER_OTLP_ENDPOINT: jaeger:4318
      OTEL_EXPORTER_OTLP_INSECURE: "true"
    depends_on:
      postgres:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully
      notification-service:
        condition: service_healthy
      jaeger:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8081/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s

  banking-api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-simple_ledger}
      DB_USER: banking_app
      DB_PASSWORD: ${BANKING_DB_PASSWORD:?BANKING_DB_PASSWORD must be set in .env}
      DB_SSLMODE: ${DB_SSLMODE:-disable}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set in .env}
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:?INTERNAL_SERVICE_TOKEN must be set in .env}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:8080,http://127.0.0.1:8080,http://localhost:3000,http://127.0.0.1:3000}
      DEMO_SEED: ${DEMO_SEED:-false}
      DEMO_SEED_PASSWORD: ${DEMO_SEED_PASSWORD:-}
      ADMIN_SEED_EMAIL: ${ADMIN_SEED_EMAIL:-}
      ADMIN_SEED_PASSWORD: ${ADMIN_SEED_PASSWORD:-}
      ENABLE_IN_PROCESS_SCHEDULER: ${ENABLE_IN_PROCESS_SCHEDULER:-true}
      RUN_DB_MIGRATIONS_ON_START: "false"
      NOTIFICATION_SERVICE_URL: http://notification-service:8090
      NOTIFICATION_SERVICE_TOKEN: ${NOTIFICATION_SERVICE_TOKEN:?NOTIFICATION_SERVICE_TOKEN must be set in .env}
      OTEL_EXPORTER_OTLP_ENDPOINT: jaeger:4318
      OTEL_EXPORTER_OTLP_INSECURE: "true"
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-banking}:${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD must be set in .env}@rabbitmq:5672/
      RABBITMQ_RETRY_DELAY: ${RABBITMQ_RETRY_DELAY:-5s}
      RABBITMQ_MAX_RETRIES: ${RABBITMQ_MAX_RETRIES:-3}
      SWAGGER_BASE_URL: ${SWAGGER_BASE_URL:-}
      PORT: ${PORT:-8080}
    depends_on:
      postgres:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully
      notification-service:
        condition: service_healthy
      jaeger:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:${PORT:-8080}/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  frontend:
    build:
      context: ./frontend
      args:
        BACKEND_API_URL: http://gateway:8082
    restart: unless-stopped
    environment:
      BACKEND_API_URL: http://gateway:8082
      NEXT_TELEMETRY_DISABLED: 1
    ports:
      - "3000:3000"
    depends_on:
      gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  gateway:
    build:
      context: .
      dockerfile: backend/Dockerfile.gateway
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-8383}:8082"
    environment:
      GATEWAY_PORT: 8082
      IDENTITY_SERVICE_URL: http://identity-service:8081
      BANKING_API_URL: http://banking-api:${PORT:-8080}
      OTEL_EXPORTER_OTLP_ENDPOINT: jaeger:4318
      OTEL_EXPORTER_OTLP_INSECURE: "true"
    depends_on:
      identity-service:
        condition: service_healthy
      banking-api:
        condition: service_healthy
      jaeger:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8082/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

volumes:
  postgres_data:
  prometheus_data:
  grafana_data:
