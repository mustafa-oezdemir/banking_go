# Auto-label PRs based on changed files

'documentation':
  - changed-files:
    - any-glob-to-any-file: 
      - '**/*.md'
      - 'backend/docs/**/*'

'dependencies':
  - changed-files:
    - any-glob-to-any-file:
      - 'backend/go.mod'
      - 'backend/go.sum'

'database':
  - changed-files:
    - any-glob-to-any-file:
      - 'backend/postgres/migrations/**/*'
      - 'backend/postgres/queries/**/*'
      - 'backend/postgres/sqlc/**/*'

'api':
  - changed-files:
    - any-glob-to-any-file:
      - 'backend/internal/api/**/*'

'service':
  - changed-files:
    - any-glob-to-any-file:
      - 'backend/internal/service/**/*'

'tests':
  - changed-files:
    - any-glob-to-any-file:
      - '**/*_test.go'
      - 'backend/run_tests.*'

'ci/cd':
  - changed-files:
    - any-glob-to-any-file:
      - '.github/**/*'
      - 'backend/.golangci.yml'
      - 'backend/Makefile'

'docker':
  - changed-files:
    - any-glob-to-any-file:
      - 'backend/Dockerfile'
      - 'frontend/Dockerfile'
      - 'docker-compose.yml'
      - '.dockerignore'

'configuration':
  - changed-files:
    - any-glob-to-any-file:
      - '*.yml'
      - '*.yaml'
      - '*.json'
      - '.env.example'
