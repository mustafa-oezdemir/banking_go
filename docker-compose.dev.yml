services:
  migrate:
    image: migrate/migrate:v4.18.3
    profiles: ["dev"]
    volumes:
      - ./backend/postgres/migrations:/migrations:ro
    depends_on:
      db:
        condition: service_healthy
    command:
      - -path=/migrations
      - -database=postgresql://${DB_USER:-root}:${DB_PASSWORD:-secret}@db:5432/${DB_NAME:-simple_ledger}?sslmode=disable
      - up

  backend-dev:
    image: alpine:3.21
    profiles: ["dev"]
    working_dir: /app
    command: ["/usr/local/bin/ledger"]
    restart: unless-stopped
    volumes:
      - ./backend/bin/linux/ledger:/usr/local/bin/ledger:ro
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-simple_ledger}
      DB_USER: ${DB_USER:-root}
      DB_PASSWORD: ${DB_PASSWORD:-secret}
      DB_SSLMODE: ${DB_SSLMODE:-disable}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set in .env}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      DEMO_SEED: ${DEMO_SEED:-false}
      DEMO_SEED_PASSWORD: ${DEMO_SEED_PASSWORD:-}
      ADMIN_SEED_EMAIL: ${ADMIN_SEED_EMAIL:-}
      ADMIN_SEED_PASSWORD: ${ADMIN_SEED_PASSWORD:-}
      ENABLE_IN_PROCESS_SCHEDULER: ${ENABLE_IN_PROCESS_SCHEDULER:-true}
      RUN_DB_MIGRATIONS_ON_START: ${RUN_DB_MIGRATIONS_ON_START:-true}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      MAIL_FROM: ${MAIL_FROM:-Pehlione DemoBank <banking@pehlione.com>}
      SMTP_HOST: ${SMTP_HOST:-mailhog}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SWAGGER_BASE_URL: ${SWAGGER_BASE_URL:-http://localhost:${BACKEND_PORT:-8383}}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      PORT: ${PORT:-8080}
    ports:
      # Keep clear of common Hyper-V/WSL exclusions and desktop app ports.
      - "${BACKEND_PORT:-8383}:${PORT:-8080}"
    depends_on:
      db:
        condition: service_healthy
      mailhog:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:${PORT:-8080}/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s
